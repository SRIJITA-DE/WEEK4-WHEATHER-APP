<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard – Srijita De</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/weather-icons.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <!-- Config & App JS -->
    <script src="js/config.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/weatherService.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>

    <div class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-cloud-sun"></i>
                <span>Weather<span>Dash</span></span>
            </div>
            <div class="header-controls">
                <button id="themeToggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="geoLocationBtn" aria-label="Use my location">
                    <i class="fas fa-location-dot"></i>
                </button>
            </div>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <div class="search-container">
                <div class="search-input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search for a city..." autocomplete="off" />
                    <button id="searchBtn"><i class="fas fa-arrow-right"></i></button>
                </div>
                <div id="autocompleteList" class="autocomplete-list"></div>
            </div>
            <div class="unit-toggle">
                <button id="unitToggle" class="unit-btn active" data-unit="metric">°C</button>
                <button id="unitToggleF" class="unit-btn" data-unit="imperial">°F</button>
            </div>
        </section>

        <!-- Favorites -->
        <section class="favorites-section">
            <div id="favoritesList" class="favorites-list"></div>
        </section>

        <!-- Main Weather Display -->
        <main class="weather-main">
            <div id="currentWeather" class="current-weather"></div>
            <div id="forecast" class="forecast-container"></div>
            <div id="extraDetails" class="extra-details"></div>
        </main>

        <!-- Loading overlay -->
        <div id="loadingOverlay" class="loading-overlay" style="display:none;">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <!-- Error toast -->
        <div id="errorToast" class="error-toast" style="display:none;"></div>

        <!-- Footer -->
        <footer class="app-footer">
            <p>&copy; 2026 Srijita De · Data from OpenWeatherMap</p>
        </footer>

    </div>

</body>
</html>
